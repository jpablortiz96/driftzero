[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "driftzero"
version = "0.1.0"
description = "DRIFTZERO — autonomous change deployment with an auditable Change Proof"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
]

[project.optional-dependencies]
# Cloud adapters (T092/T093) live in src/driftzero_cloud/, outside the M0 purity
# boundary. They are an EXTRA on purpose: `pip install driftzero` must never pull a
# Google SDK into an environment that only runs the deterministic core.
cloud = [
    "google-cloud-firestore>=2.29",
    "google-cloud-storage>=3.13",
]
# The production HTTP surface (T094/T095) in src/driftzero_api/. Declared separately
# from `console` so a deployment installs the API without the demo console, and so the
# API's dependency on FastAPI is stated rather than inherited by coincidence.
api = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
]
# The public judge surface (src/driftzero_public/). Separate from `api` because the
# public service must NOT install the Firestore/Storage adapters or anything else that
# could reach a data plane directly: it talks only to the private API, over HTTP, with
# the service identity Cloud Run attaches to it.
public = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
    # The live pilot is HTML forms and a file upload, so FastAPI needs multipart. Its
    # absence is not an import error: the app builds and then fails at *startup* when a
    # Form route is analysed, which is a container that never listens.
    "python-multipart>=0.0.9",
]
# T098 observability export. Separate from `cloud` because a process can persist
# durably without tracing, and tracing must never be a hard requirement to serve.
telemetry = [
    "opentelemetry-sdk>=1.42",
    "opentelemetry-exporter-gcp-trace>=1.15",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]
console = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
]
# Live field observation only. The deterministic core and the full test suite run
# with none of this installed, which is what the M0 purity guard asserts.
live = [
    "google-auth>=2.0",
    "httpx>=0.27",
    "google-adk>=2.7",
]

[tool.setuptools.packages.find]
where = ["src"]

# The M6 product surface is HTML/CSS/JS, and setuptools ships only *.py by default.
# Without this the wheel installs cleanly and every /web route 500s in the container —
# which is exactly what happened, and what deploying before checking would have hidden.
# Attached to the parent package on purpose: driftzero/web/ holds no __init__.py, and
# adding one only to satisfy packaging would put Python inside the purity boundary.
[tool.setuptools.package-data]
"driftzero" = ["web/templates/*.html", "web/static/*"]
"driftzero_public" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
